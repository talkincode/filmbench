  - id: door
    title: 门厅 · 雨夜
    role: picture
    durationFrames: 120
    intent:
      description: 要拆的旧公寓门厅，雨从门缝里灌进来，只剩一盏顶灯
      action: 静止，雨声，灯管轻微频闪
      prompt: 废弃老公寓的门厅，深夜暴雨，唯一的裸灯泡发出冷白光，地面是裂开的湿瓷砖，墙皮大片剥落，墙边堆着纸箱，35mm
        电影剧照，青蓝与琥珀色调，画面里没有人，没有文字，没有水印
      prompts:
        image: 废弃老公寓的门厅，深夜暴雨，唯一的裸灯泡发出冷白光，地面是裂开的湿瓷砖，墙皮大片剥落，墙边堆着纸箱，35mm
          电影剧照，青蓝与琥珀色调，画面里没有人，没有文字，没有水印
        video: 镜头极缓慢向前推进，雨丝持续落下，顶灯轻微频闪两次，地面水洼里的倒影随之晃动
    binder:
      provider: imagine
      task: image
      params:
        model: MAI-Image-2.6-Flash
        width: 1344
        height: 768
    subjects: []
    references: []
    dependsOn: []
  - id: courier
    title: 快递员 · 放下包裹
    role: picture
    durationFrames: 120
    intent:
      description: 穿深色雨衣的快递员背对镜头，把一个小纸箱放在门口脚垫上
      action: 弯腰、放下、起身，肩膀上有雨
      prompt: 穿深色雨衣的快递员背对镜头，弯腰把一个小纸箱放到湿透的脚垫上，冷白日光灯从头顶照下，肩膀上有雨水，35mm
        电影剧照，浅景深，画面里没有文字，没有水印
      prompts:
        image: 穿深色雨衣的快递员背对镜头，弯腰把一个小纸箱放到湿透的脚垫上，冷白日光灯从头顶照下，肩膀上有雨水，35mm
