    title: 走廊 · 门缝的光
    role: picture
    durationFrames: 120
    intent:
      description: 走廊尽头那扇门缝里漏出暖光，地上有湿脚印
      action: 极缓慢前推，脚印从镜头下缘延伸出去
      prompt: 老旧公寓的长走廊，尽头那扇门缝里漏出暖光，地上的湿脚印一路延伸过去，35mm
        变形宽银幕电影剧照，青蓝阴影与琥珀色光斑，画面里没有人，没有文字，没有水印
