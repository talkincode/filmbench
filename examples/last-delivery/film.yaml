      provider: imagine
      task: image
      params:
        model: MAI-Image-2.6-Flash
        width: 1344
        height: 768
        duration: 4
    subjects: []
    references:
      - asset: asset-e83deb1f57d4
        role: environment
    dependsOn:
      - shot: lift
        kind: continuity
  - id: number
    title: 门牌 · 14 号
    role: picture
    durationFrames: 60
    intent:
      description: " scratched brass number plate beside the door"
      action: 特写，焦点从划痕移到数字
      prompt: 黄铜门牌特写，上面是数字 14，旁边是深色门框，表面有划痕，浅景深，冷光带一点暖边，35mm 电影剧照，除数字外没有文字，没有水印
