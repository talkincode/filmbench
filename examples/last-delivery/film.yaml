        video: 镜头保持不动，快递员弯腰放下包裹后直起身，雨衣上的水珠滑落，肩头滴下一串水
    binder:
      provider: imagine
      task: image
      params:
        model: MAI-Image-2.6-Flash
        width: 1344
        height: 768
    subjects: []
    references:
      - asset: asset-7d0a95eafcf8
        role: environment
    dependsOn:
      - shot: door
        kind: continuity
