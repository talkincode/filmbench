title: 最后一单 · 雨夜铺底
story: >-
  雨夜、待拆的旧楼、最后一单。弦乐几乎不动，像潮气贴在墙上；
  低音只给出房间的尺寸；音盒每隔两小节响一次，像楼上有人轻轻放下一件东西。
  整段保持在 pp–p，给雨声和脚步留出空间。
