title: 最后一单 · 雨夜铺底
story: >-
  雨夜、待拆的旧楼、最后一单。没有弦乐铺底，只留钢琴、合成低音与定音鼓。
  钢琴在第 2 秒进入，两次模进分别在 6s 与 14s 抬起；10s 与 16s 用定音鼓各砸一下，
  标记他放下包裹、以及门里那只手。
