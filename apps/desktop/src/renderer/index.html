<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>filmbench</title>
<style>
  :root{
    --paper:#ece5d7;--paper-2:#e3dbc9;--paper-hi:#f8f3e8;--ink:#191610;--ink-2:#4f4838;--ink-3:#7d7460;
    --rule:#c9bfa9;--rule-hi:#ddd4c0;--accent:#ad3a20;--ok:#2b5f50;--warn:#8a6413;--block:#a3291a;
    --mono:"SF Mono","JetBrains Mono","Menlo",monospace;--serif:"Iowan Old Style","Palatino","Songti SC",Georgia,serif;
    --shadow:0 1px 0 rgba(255,255,255,.6),0 18px 40px -28px rgba(40,30,10,.7);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15.5px;overflow:hidden}
  button{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--rule);background:var(--paper-hi);
    color:var(--ink);border-radius:8px;cursor:pointer;transition:all .13s ease;white-space:nowrap}
  button:hover{border-color:var(--ink-2);transform:translateY(-1px)}
  button:active{transform:none}
  button.primary{background:var(--ink);color:var(--paper-hi);border-color:var(--ink)}
  button.ghost{background:transparent}
  button.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
  /* —— 左栏 —— */
  .rail{background:var(--paper-2);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
  .rail .brand{padding:42px 14px 10px;-webkit-app-region:drag}
  .brand h1{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.01em}
  .brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
  .proj{margin:6px 10px 10px;padding:8px 9px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-hi);cursor:pointer;-webkit-app-region:no-drag}
  .proj:hover{border-color:var(--ink-2)}
  .proj .name{font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
  .proj .name span:last-child{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto}
  .proj .path{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-hi);border-top:1px solid var(--rule-hi);border-bottom:1px solid var(--rule-hi)}
  .stat{background:var(--paper-2);padding:6px 10px}
  .stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-family:var(--mono);font-size:13.5px;margin-top:2px;font-variant-numeric:tabular-nums}
  .rail h2{font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--ink);margin:12px 12px 6px;
    display:flex;justify-content:space-between;align-items:baseline}
  .rail h2 span{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
  .jobs{padding:0 8px 10px;overflow:auto;flex:1}
  .jlist{list-style:none;margin:0;padding:0}
  .jrow{display:grid;grid-template-columns:7px minmax(0,1fr) auto;grid-template-areas:"dot name ph" "dot prov prov";
    column-gap:7px;row-gap:1px;padding:7px 6px;border-bottom:1px solid var(--rule-hi);cursor:pointer;border-radius:4px}
  .jrow:hover{background:rgba(25,22,16,.045)}
  .jrow .dot{grid-area:dot;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:5px}
  .jrow .jname{grid-area:name;font-family:var(--mono);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jrow .jprov{grid-area:prov;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jrow .jph{grid-area:ph;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
  .jrow.done .dot{background:var(--ok)}
  .jrow.failed .dot,.jrow.rejected .dot{background:var(--block)}
  .jrow.running .dot{background:var(--warn)}
  .jrow.requested .dot{background:var(--warn);opacity:.55}
  .jrow.failed .jph,.jrow.rejected .jph{color:var(--block)}
  .jrow.done .jph{color:var(--ok)}
  .hints{padding:8px 12px 12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.65;border-top:1px solid var(--rule-hi)}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper-hi)}

  /* —— 主区 —— */
  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{-webkit-app-region:drag;padding:40px 26px 12px;display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid transparent;transition:border-color .2s}
  .main.scrolled .topbar{border-color:var(--rule-hi)}
  .topbar h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;-webkit-app-region:no-drag}
  .topbar .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:4px;-webkit-app-region:no-drag}
  .topbar .spacer{flex:1}
  .topbar .actions{display:flex;gap:8px;-webkit-app-region:no-drag}

  .scroll{overflow:auto;padding:18px 26px 40px;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:16px}
  .card{position:relative;background:var(--paper-hi);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);
    cursor:pointer;text-align:left;padding:0;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
  .card:hover{transform:translateY(-3px);border-color:var(--ink-2)}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(173,58,32,.18),var(--shadow)}
  .card .frame{aspect-ratio:16/9;position:relative;background:linear-gradient(160deg,#221f19,#12100b);overflow:hidden}
  .card .frame img,.card .frame video{width:100%;height:100%;object-fit:cover;opacity:.92}
  .card .idx{position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:20px;color:#e9e2d2;letter-spacing:-.03em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .card .badge{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 6px;border:1px solid currentColor;border-radius:3px;background:rgba(16,14,10,.55);backdrop-filter:blur(2px)}
  .card .badge.ready{color:#8fc7b2}.card .badge.stale{color:#e0b563}.card .badge.missing{color:#c3b79c}
  .card .body{padding:10px 12px 11px}
  .card h3{margin:0 0 5px;font-size:15.5px;font-weight:600;line-height:1.3}
  .card .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);gap:8px}
  .card .row .provider{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding:40px 4px;line-height:1.9}
  .empty code{background:rgba(25,22,16,.06);padding:1px 5px;border-radius:3px}

  /* —— 详情抽屉 —— */
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(540px,94vw);background:var(--paper-hi);border-left:1px solid var(--rule);
    box-shadow:-24px 0 60px -40px rgba(30,22,8,.8);display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);z-index:30}
  .drawer.open{transform:none}
  .dhead{display:flex;align-items:center;gap:8px;padding:14px 14px 9px;border-bottom:1px solid var(--rule);-webkit-app-region:drag}
  /* 拖拽区域会吞掉鼠标事件：里面所有可点的东西必须显式排除 */
  .dhead button,.dhead .n{-webkit-app-region:no-drag}
  .dhead .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);-webkit-app-region:no-drag}
  .dhead h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-app-region:no-drag}
  .dbody{overflow:auto;padding:10px 14px 30px;display:flex;flex-direction:column;gap:11px}
  .sec{border-top:1px solid var(--rule-hi);padding-top:9px}
  .sec:first-child{border-top:0;padding-top:0}
  .sec h4{margin:0 0 9px;font-family:var(--serif);font-size:14px;letter-spacing:0;color:var(--ink);font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--rule-hi)}
  .sec h4 span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:400;letter-spacing:.02em;text-transform:none}
  .sec p{margin:0 0 5px;font-size:13px;line-height:1.5;color:var(--ink-2)}
  .sec p.desc{font-size:14px;color:var(--ink)}
  .dim{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
  .okline{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--ok)}
  .hintline{margin:-3px 0 2px;font-family:var(--mono);font-size:11.5px;line-height:1.45;color:var(--ink-3)}
  details.sec>summary{cursor:pointer;list-style:none;font-family:var(--serif);font-size:14px;font-weight:600;
    color:var(--ink);display:flex;justify-content:space-between;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--rule-hi)}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::after{content:"＋";color:var(--ink-3)}
  details.sec[open]>summary::after{content:"－"}
  details.sec[open]>summary{margin-bottom:7px}
  .prompt{font-family:var(--mono);font-size:12px;line-height:1.6;background:rgba(25,22,16,.045);border:1px solid var(--rule-hi);
    border-radius:6px;padding:8px 10px;color:var(--ink-2);word-break:break-word}
  .preview{background:#12100b;border-radius:6px;overflow:hidden;border:1px solid var(--rule)}
  .preview video,.preview img{width:100%;display:block;max-height:280px;object-fit:contain;background:#12100b}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2);background:var(--paper)}
  .tag.bad{border-color:rgba(163,41,26,.45);color:var(--block)}
  .tag.ok{border-color:rgba(43,95,80,.4);color:var(--ok)}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}
  .kv dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:2px}
  .kv dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-all}
  .check{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;padding:3px 0;color:var(--ink-2)}
  .check .m{width:10px;flex:0 0 auto}
  .check[data-s="fail"] .m{color:var(--block)}.check[data-s="warn"] .m{color:var(--warn)}.check[data-s="pass"] .m{color:var(--ok)}.check[data-s="unknown"] .m{color:var(--ink-3)}
  .strip{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 5px;scrollbar-width:thin}
  .thumb{position:relative;flex:0 0 auto;width:124px;border:1px solid var(--rule);border-radius:5px;overflow:hidden;
    background:var(--paper);padding:0;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .thumb:hover{border-color:var(--ink-2)}
  .thumb.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(173,58,32,.16)}
  .thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#12100b}
  .thumb .flag{position:absolute;top:4px;left:4px;font-family:var(--mono);font-size:11.5px;padding:1px 4px;border-radius:3px;
    background:rgba(16,14,10,.72);color:#e9e2d2;letter-spacing:.06em}
  .thumb.sel .flag{background:var(--accent);color:#fff}
  .thumb .cap{display:flex;justify-content:space-between;gap:4px;padding:4px 6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .thumb.add{width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border-style:dashed;color:var(--ink-3);font-family:var(--mono);font-size:20px;line-height:1}
  .thumb.add .cap2{font-size:11px;letter-spacing:.1em}
  .actbar{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 9px;border-bottom:1px solid var(--rule-hi)}
  .actbar .primary{box-shadow:0 6px 14px -10px rgba(25,22,16,.8)}
  .kv2{display:grid;grid-template-columns:56px minmax(0,1fr);gap:3px 8px;font-family:var(--mono);font-size:11.5px;align-items:baseline}
  .kv2 span{color:var(--ink-3);font-size:11px;letter-spacing:.04em}
  .kv2 b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot{display:grid;grid-template-columns:46px minmax(0,1fr) 104px 24px;gap:7px;align-items:center;border:1px solid var(--rule-hi);
    border-radius:5px;padding:4px 6px;background:var(--paper);margin-bottom:4px}
  .slot .mini{width:46px;height:26px;object-fit:cover;border-radius:3px;background:#12100b;display:block}
  .slot.empty{grid-template-columns:1fr;color:var(--ink-3)}
  .slot .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .slot .id{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot select{font-family:var(--mono);font-size:11.5px;padding:2px 3px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-hi);color:var(--ink)}
  .slot button{padding:0;width:22px;height:22px;border-radius:5px;line-height:1}
  .slot.empty{border-style:dashed;color:var(--ink-3);display:block;font-family:var(--mono);font-size:11.5px;padding:9px 10px}
  .pe{margin-top:5px}
  .pe .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
  .pe textarea{width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.5;padding:6px 8px;border:1px solid var(--rule);
    border-radius:5px;background:var(--paper);color:var(--ink);resize:vertical;min-height:40px}
  .pe textarea:focus{outline:none;border-color:var(--ink-2);background:var(--paper-hi)}
  .cid{font-family:var(--mono);font-size:11px;color:var(--ink-3);opacity:.8}
  .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:3px 0}
  .ev .s{color:var(--ink-3)}
  .ev .a{color:var(--ink-3);font-size:11px}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{border:1px solid var(--rule-hi);border-radius:6px;padding:7px 9px;background:var(--paper);display:flex;gap:8px;align-items:center}
  .item .grow{flex:1;min-width:0}
  .item .id{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
  .actions-row{display:flex;gap:6px;flex-wrap:wrap}

  /* —— 项目选择 —— */
  .modal{position:fixed;inset:0;background:rgba(25,22,16,.45);display:none;place-items:center;z-index:60}
  .modal.open{display:grid}
  .modal .panel{width:min(620px,92vw);max-height:76vh;background:var(--paper-hi);border:1px solid var(--ink);border-radius:6px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule)}
  .modal header h3{margin:0;font-size:16.5px}
  .modal .list{overflow:auto;padding:10px 12px}
  .pick{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid transparent;border-radius:6px;cursor:pointer}
  .pick:hover{background:var(--paper);border-color:var(--rule)}
  .pick .t{font-family:var(--mono);font-size:12px}
  .pick .d{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
  .pick .now{font-family:var(--mono);font-size:11px;color:var(--ok);border:1px solid;border-radius:3px;padding:1px 4px}

  /* —— 截图标注 —— */
  .snap{position:fixed;inset:0;background:rgba(16,14,10,.86);display:none;flex-direction:column;z-index:80}
  .snap.open{display:flex}
  .snapbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper-hi);border-bottom:1px solid var(--ink)}
  .snapbar .grp{display:flex;gap:4px;padding-right:8px;margin-right:8px;border-right:1px solid var(--rule-hi)}
  .snapbar button.on{background:var(--ink);color:var(--paper-hi);border-color:var(--ink)}
  .swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--paper-hi);outline:1px solid var(--rule);cursor:pointer}
  .swatch.on{outline:2px solid var(--ink)}
  .snapstage{flex:1;overflow:auto;display:grid;place-items:center;padding:22px}
  .snapwrap{position:relative;line-height:0;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
  .snapwrap canvas{max-width:100%;max-height:calc(100vh - 160px);cursor:crosshair}
  .snapfoot{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--paper-hi);border-top:1px solid var(--ink);font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .snapfoot .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  #txtInput{position:absolute;display:none;font:600 18px/1.3 var(--serif);padding:3px 6px;border:1px solid var(--ink);background:rgba(248,243,232,.96);color:var(--ink);min-width:80px;outline:none}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper-hi);
    font-family:var(--mono);font-size:12px;padding:9px 16px;border-radius:7px;opacity:0;transition:.18s;z-index:100;pointer-events:none;max-width:70vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(120,108,84,.35);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>filmbench</h1>
      <div class="sub">本地视频工作站</div>
    </div>
    <div class="proj" id="projBtn" title="切换项目">
      <div class="name"><span id="projName">…</span><span id="projSwap">切换 ⇄</span></div>
      <div class="path" id="projPath"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">镜头</div><div class="v" id="sShots">—</div></div>
      <div class="stat"><div class="k">帧数</div><div class="v" id="sFrames">—</div></div>
      <div class="stat"><div class="k">就位</div><div class="v" id="sReady">—</div></div>
      <div class="stat"><div class="k">花费</div><div class="v" id="sCost">—</div></div>
    </div>
    <h2>作业队列 <span id="jobCount"></span></h2>
    <div class="jobs" id="jobList"></div>
    <div class="hints">
      <div><kbd>⌘⇧S</kbd> 截图标注</div>
      <div><kbd>↑</kbd><kbd>↓</kbd> 切换分镜</div>
      <div><kbd>Esc</kbd> 关闭面板</div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <div>
        <h2 id="title">—</h2>
        <div class="meta" id="meta"></div>
      </div>
      <span class="spacer"></span>
      <div class="actions">
        <button id="bSubmit">提交待办</button>
        <button id="bRun" class="primary">执行队列</button>
        <button id="bBuild">出片</button>
        <button id="bStory">审计故事板</button>
        <button id="bSnap" class="ghost" title="⌘⇧S">截图</button>
      </div>
    </div>
    <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <span class="n" id="dNum"></span>
    <h2 id="dTitle"></h2>
    <button class="sm ghost" id="dPrev">↑</button>
    <button class="sm ghost" id="dNext">↓</button>
    <button class="sm" id="dClose" title="关闭（Esc）">关闭 ✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<div class="modal" id="assetModal">
  <div class="panel" style="width:min(680px,92vw)">
    <header><h3>选择参考素材</h3><button class="sm" id="amClose">关闭</button></header>
    <div class="list" id="assetList"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--ink-3)">
      从本项目已登记的素材里选；加进去后可以在列表里改用途（identity / wardrobe / environment / first_frame …）
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <header><h3>打开项目</h3><button class="sm" id="mClose">关闭</button></header>
    <div class="list" id="pickList"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--rule);display:flex;gap:8px">
      <button class="primary" id="pickDir">打开目录…</button>
      <span style="font-family:var(--mono);font-size:11px;color:var(--ink-3);align-self:center">选择包含 journal/ 的目录；不是项目可以选择初始化</span>
    </div>
  </div>
</div>

<div class="snap" id="snap">
  <div class="snapbar">
    <div class="grp">
      <button data-tool="select" class="on" title="框选（可裁剪）">框选</button>
      <button data-tool="rect">矩形</button>
      <button data-tool="arrow">箭头</button>
      <button data-tool="text">文字</button>
    </div>
    <div class="grp" id="colors"></div>
    <button id="snapUndo">撤销</button>
    <button id="snapCrop">裁剪</button>
    <span style="flex:1"></span>
    <button id="snapCopy" class="primary">复制图片</button>
    <button id="snapSave">保存到项目</button>
    <button id="snapClose">关闭</button>
  </div>
  <div class="snapstage" id="snapStage">
    <div class="snapwrap" id="snapWrap">
      <canvas id="snapCanvas"></canvas>
      <input id="txtInput" spellcheck="false">
    </div>
  </div>
  <div class="snapfoot">
    <span>拖拽框选 · 选工具后直接画 · 保存后自动复制路径</span>
    <span class="p" id="snapPath"></span>
    <button class="sm ghost" id="snapCopyPath" disabled>复制路径</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const f = window.filmbench;
const S = {
  project: null,
  state: null,
  shots: [],
  detail: null,
  shotId: null,
  snap: { img: null, tool: "select", color: "#ad3a20", shapes: [], sel: null, drag: null, path: null },
};
const COLORS = ["#ad3a20", "#191610", "#2b5f50", "#d9a03c"];
const ROLE_ZH = {
  identity: "身份", wardrobe: "服装", prop: "道具", environment: "环境", layout: "布局",
  first_frame: "首帧", last_frame: "尾帧", style: "风格", other: "未分类",
};
const PHASE_ZH = { requested: "排队", running: "执行中", done: "完成", failed: "失败", rejected: "被拒" };
const REVIEW_ZH = { approved: "已批准", rejected: "已否决" };

function toast(msg, ms = 2000) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), ms);
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fileUrl = (p) => "file://" + encodeURI(p).replace(/#/g, "%23");
const stateChip = (s) => (!s.hasOutput ? ["缺产物", "missing"] : s.stale ? ["过期", "stale"] : ["就位", "ready"]);

async function rpc(cmd, args = {}) {
  return f.rpc(cmd, args);
}

async function load() {
  const p = await f.project();
  S.project = p;
  const st = await rpc("state");
  S.state = st;
  S.shots = st.shots;
  render();
  if (S.shotId && !S.shots.some((s) => s.id === S.shotId)) closeDetail();
}

function render() {
  const st = S.state;
  $("projName").textContent = st.project?.title || st.project?.name || "（尚未创建项目）";
  $("projPath").textContent = st.dir || "";
  $("title").textContent = st.project?.title || "—";
  $("meta").textContent = st.project
    ? `${st.project.name} · ${st.project.format.width}×${st.project.format.height}@${st.project.format.fps}fps · 修订 #${st.head.seq}`
    : "";
  $("sShots").textContent = st.shots.length;
  $("sFrames").textContent = st.totalFrames;
  $("sReady").textContent = `${st.shots.filter((s) => s.hasOutput && !s.stale).length}/${st.shots.length}`;
  $("sCost").textContent = `${(st.cost?.spent ?? 0).toFixed(2)}`;

  $("grid").innerHTML = st.shots.map((s) => {
    const [label, cls] = stateChip(s);
    const sel = s.selected && s.selected === s.asset;
    return `<button class="card${S.shotId === s.id ? " active" : ""}" data-shot="${esc(s.id)}">
      <div class="frame">
        <span class="idx">${String(s.order).padStart(2, "0")}</span>
        <span class="badge ${cls}">${label}</span>
      </div>
      <div class="body">
        <h3>${esc(s.title)}</h3>
        <div class="row"><span>${s.durationFrames}f · ${(s.durationFrames / (st.project?.format.fps || 30)).toFixed(2)}s</span>
          <span class="provider">${esc(s.provider)}${sel ? " · 已选" : ""}</span></div>
      </div></button>`;
  }).join("") || `<div class="empty">还没有镜头。<br>用 agent / CLI 加一个：<code>filmbench shot add …</code></div>`;

  $("grid").querySelectorAll(".card").forEach((el) => {
    el.onclick = () => openDetail(el.dataset.shot);
  });

  posters().catch(() => {});

  const jobs = (st.jobs || []).slice(-20).reverse();
  $("jobCount").textContent = jobs.length ? `${jobs.length} 条` : "";
  $("jobList").innerHTML = jobs.length
    ? `<ul class="jlist">${jobs.map((j) => `<li class="jrow ${esc(j.phase)}" data-shot="${esc(j.shot)}">
        <span class="dot"></span>
        <span class="jname">${esc(j.shot)}</span>
        <span class="jph">${PHASE_ZH[j.phase] || esc(j.phase)}</span>
        <span class="jprov">${esc(j.provider)} · ${esc(j.task)}</span>
      </li>`).join("")}</ul>`
    : `<p class="dim" style="padding:6px 8px">队列为空</p>`;
  $("jobList").querySelectorAll(".jrow").forEach((row) => {
    row.onclick = () => openDetail(row.dataset.shot);
  });
}

/* —— 详情 —— */
async function openDetail(id, opts = {}) {
  try {
    const sameShot = S.shotId === id;
    const keep = sameShot ? $("dBody").scrollTop : 0;
    const d = await rpc("shot_detail", { shot: id });
    S.detail = d;
    S.shotId = id;
    render();
    renderDetail(d);
    $("drawer").classList.add("open");
    $("drawer").setAttribute("aria-hidden", "false");
    const apply = () => { $("dBody").scrollTop = sameShot || opts.keepScroll ? keep : 0; };
    apply();
    requestAnimationFrame(apply);
  } catch (e) {
    toast(e.message);
  }
}

function closeDetail() {
  S.shotId = null;
  S.detail = null;
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("dBody").innerHTML = "";
  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  render();
}

const MARK = { pass: "●", fail: "■", warn: "▲", unknown: "○" };

function renderDetail(d) {
  const s = d.shot;
  const produce = d.produce;
  const selected = s.selected;
  const cands = (s.candidates || []).slice();
  if (produce && !cands.some((c) => c.asset === produce.asset)) {
    cands.unshift({ asset: produce.asset, actor: "—", review: "selected" });
  }
  const fps = d.project.format?.fps || 30;
  const approved = s.reviewed === "approved";

  const sameInputs = Boolean(d.inputs?.sameAsLast);
  const deterministic = d.provider?.determinism === "deterministic";
  const pendingSame = (d.jobs || []).find((j) => j.phase === "requested" && j.inputsHash === d.inputs?.current);
  const est = d.estimate;
  const estText = !est ? "" : est.priceUnknown ? "价格未知" : `预估 ${est.amount.toFixed(2)} ${est.currency}`;

  const next = !produce
    ? { label: "提交作业", act: "submit" }
    : !selected || selected !== produce.asset
      ? { label: "选定这一版", act: "select" }
      : !approved
        ? { label: "批准这一版", act: "approve" }
        : pendingSame
          ? { label: "已有一版在排队", act: "noop", disabled: true }
          : sameInputs && deterministic
            ? { label: "输入未变，重跑无意义", act: "noop", disabled: true }
            : sameInputs
              ? { label: "同参重抽一版", act: "submit" }
              : { label: "按新输入生成一版", act: "submit" };

  const thumbs = cands.map((c) => {
    const isSel = c.asset === selected;
    const bad = c.review === "rejected";
    const state = isSel ? "已选" : bad ? "已否决" : c.review === "unreviewed" ? "未审阅" : c.review === "candidate" ? "已批准" : "候选";
    return `<button class="thumb${isSel ? " sel" : ""}" data-asset="${esc(c.asset)}" title="${esc(c.asset)}">
      <span class="flag">${state}</span>
      <img data-poster="${esc(c.asset)}" alt="">
      <span class="cap"><span>${esc(c.actor || "—")}</span><span>${esc(c.asset.slice(6, 12))}</span></span>
    </button>`;
  }).join("");

  const ROLES = ["identity", "wardrobe", "prop", "environment", "layout", "first_frame", "last_frame", "style", "other"];
  const refs = s.references.length
    ? s.references.map((r, i) => `<div class="slot">
        <img class="mini" data-poster="${esc(r.asset)}" alt="">
        <span class="id" title="${esc(r.absPath || r.asset)}">${esc(r.asset)}</span>
        <select data-role="${esc(r.asset)}">${ROLES.map((x) => `<option value="${x}"${x === r.role ? " selected" : ""}>${ROLE_ZH[x]}</option>`).join("")}</select>
        <button class="sm ghost" data-unref="${esc(r.asset)}" title="移除">✕</button>
      </div>`).join("")
    : `<div class="slot empty">还没有参考图（最多 5 张）</div>`;

  const failing = (s.checks || []).filter((c) => c.status === "fail" || c.status === "warn");
  const checks = failing.length
    ? failing.map((c) => `<div class="check" data-s="${c.status}"><span class="m">${MARK[c.status]}</span>
        <span><b>${esc(c.label || c.id)}</b>${c.detail ? " — " + esc(c.detail) : ""}</span></div>`).join("")
    : `<p class="okline">✓ 全部检查通过</p>`;

  const jobRow = (j) => `<div class="item">
      <div class="grow"><div class="id">${esc(j.jobId)}</div><div class="meta">${esc(j.provider)} · ${esc(j.task)} · ${PHASE_ZH[j.phase] || esc(j.phase)}${j.reason ? " · " + esc(j.reason) : ""}</div></div>
      ${j.asset ? `<button class="sm ghost" data-asset-jump="${esc(j.asset)}">看这一版</button>` : ""}
    </div>`;

  const events = d.events.slice(-10).reverse().map((e) =>
    `<div class="ev"><span class="s">#${e.seq}</span><span>${esc(e.summary)}<div class="a">${esc(e.actor)} · ${esc(e.at.slice(5, 19).replace("T", " "))}</div></span></div>`
  ).join("");

  const deps = s.dependsOn.length ? s.dependsOn.map((x) => `<span class="tag" data-dep="${esc(x.shot)}">← ${esc(x.shot)} ${esc(x.kind)}</span>`).join("") : `<span class="tag">无</span>`;
  const dependents = s.dependents.length ? s.dependents.map((x) => `<span class="tag" data-dep="${esc(x.shot)}">→ ${esc(x.shot)} ${esc(x.kind)}</span>`).join("") : `<span class="tag">无</span>`;

  $("dNum").textContent = `${String(s.order).padStart(2, "0")}/${String(s.count).padStart(2, "0")}`;
  $("dTitle").textContent = s.title;

  $("dBody").innerHTML = `
    <div class="sec">
      <h4>候选画面 <span>${cands.length} 个 · 点图切换进片版本</span></h4>
      <div class="strip">
        ${thumbs}
        <button class="thumb add" id="dAction2" title="生成新一版"><span>＋</span><span class="cap2">生成</span></button>
      </div>
    </div>

    <div class="actbar">
      <button class="primary" id="dAction"${next.disabled ? " disabled" : ""}>${next.label}</button>
      <button id="dApprove" ${selected ? "" : "disabled"}>批准</button>
      <button id="dReject" ${selected ? "" : "disabled"}>否决</button>
      <button class="ghost" id="dSnap">截图标注</button>
      ${produce ? `<button class="ghost" data-open="${esc(produce.absPath)}">打开</button>
        <button class="ghost" data-reveal="${esc(produce.absPath)}">显示</button>` : ""}
    </div>
    <p class="hintline">${
      pendingSame
        ? "已排队，点右上「执行队列」才会真正调用模型"
        : next.disabled
          ? "确定性 provider：同输入会得到同一产物；改参数或参考再生成"
          : `提交只排队 · 右上「执行队列」才真正生成${estText ? ` · ${estText}` : ""}`
    }</p>

    <div class="sec">
      <h4>意图</h4>
      <p class="desc">${esc(s.intent.description) || "<span class='dim'>未填写描述</span>"}</p>
      ${s.intent.action ? `<p>${esc(s.intent.action)}</p>` : ""}
      <div class="pe"><div class="lbl"><span>图片提示词</span></div>
        <textarea data-pe="image" rows="2" placeholder="主体 · 动作 · 机位 · 光线 · 不要文字">${esc(s.intent.prompts?.image || s.intent.prompt || "")}</textarea></div>
      <div class="pe"><div class="lbl"><span>视频提示词</span></div>
        <textarea data-pe="video" rows="2" placeholder="动作变化 · 运镜 · 时间顺序">${esc(s.intent.prompts?.video ?? "")}</textarea></div>
    </div>

    <div class="sec">
      <h4>绑定</h4>
      <div class="chips">
        <span class="tag">${esc(s.binder.provider)}</span><span class="tag">${esc(s.binder.task)}</span>
        ${Object.entries(s.binder.params || {}).map(([k, v]) => `<span class="tag">${esc(k)}=${esc(v)}</span>`).join("")}
        ${s.subjects.length ? s.subjects.map((x) => `<span class="tag ${x.approved ? "ok" : "bad"}">${esc(x.name)}@${x.revision}${x.variant ? "·" + esc(x.variant) : ""}</span>`).join("") : ""}
      </div>
    </div>

    <div class="sec">
      <h4>参考图 <span>${s.references.length}/5 · 喂给模型的输入</span></h4>
      ${refs}
      <button class="sm" id="dAddRef" ${s.references.length >= 5 ? "disabled" : ""}>+ 添加参考</button>
    </div>

    <div class="sec">
      <h4>检查 <span>${failing.filter((c) => c.status === "fail").length} 项阻断 · ${failing.length} 项待处理</span></h4>
      ${checks}
    </div>

    ${produce ? `<div class="sec">
      <h4>产物</h4>
      <div class="kv2">
        <span>素材</span><b>${esc(produce.asset)}</b>
        <span>规格</span><b>${produce.width}×${produce.height} · ${produce.durationFrames}f · ${produce.kind === "video" ? "视频" : "图片"}</b>
        <span>体积</span><b>${(produce.bytes / 1024).toFixed(0)} KB</b>
        <span>摘要</span><b>${esc(produce.sha256).slice(0, 16)}…</b>
        <span>路径</span><b title="${esc(produce.path)}">${esc(produce.path)}</b>
      </div>
    </div>` : ""}

    <details class="sec">
      <summary>时间轴与依赖</summary>
      <div class="kv2">
        <span>位置</span><b>${s.startFrame} → ${s.endFrame} 帧 · ${(s.startFrame / fps).toFixed(2)}s → ${(s.endFrame / fps).toFixed(2)}s</b>
        <span>时长</span><b>${s.durationFrames} 帧 · ${s.seconds.toFixed(2)}s</b>
      </div>
      <div class="chips" style="margin-top:6px">${deps}${dependents}</div>
    </details>

    <details class="sec">
      <summary>作业历史 <span>${d.jobs.length}</span></summary>
      <div class="list">${d.jobs.length ? d.jobs.slice().reverse().map(jobRow).join("") : `<p class="dim">还没有作业</p>`}</div>
    </details>

    <details class="sec">
      <summary>事件 <span>${d.events.length}</span></summary>
      ${events || `<p class="dim">无</p>`}
    </details>
  `;

  /* 缩略图：按需取首帧 */
  $("dBody").querySelectorAll("[data-poster]").forEach(async (img) => {
    try {
      const path = await rpc("poster", { shot: s.id, asset: img.dataset.poster });
      img.src = fileUrl(path.path) + `?v=${img.dataset.poster}`;
    } catch {}
  });
  $("dBody").querySelectorAll(".thumb[data-asset]").forEach((btn) => (btn.onclick = async () => {
    const asset = btn.dataset.asset;
    if (asset === selected) return;
    try { await rpc("select", { shot: s.id, asset }); toast("已选定"); await refreshAndDetail(); } catch (e) { toast(e.message); }
  }));

  const runAction = async () => {
    if (next.disabled) {
      toast(next.label === "已有一版在排队" ? "已有一版在排队，去右上执行队列" : "输入没变，换参数或参考再生成");
      return;
    }
    try {
      if (next.act === "submit") {
        const r = await rpc("submit", { shot: s.id });
        if (r?.[0]?.reused) { toast("已有一版在排队，没有重复提交"); await refreshAndDetail(); return; }
      }
      if (next.act === "select") await rpc("select", { shot: s.id });
      if (next.act === "approve") await rpc("review", { shot: s.id });
      toast(next.act === "submit" ? "已排队 · 去右上「执行队列」开始生成" : `${next.label} 完成`);
      await refreshAndDetail();
    } catch (e) { toast(e.message, 4000); }
  };
  $("dAction").onclick = runAction;
  $("dAction2").onclick = runAction;

  $("dApprove").onclick = async () => { try { await rpc("review", { shot: s.id }); toast("已批准"); await refreshAndDetail(); } catch (e) { toast(e.message); } };
  $("dReject").onclick = async () => { try { await rpc("review", { shot: s.id, reject: true }); toast("已否决"); await refreshAndDetail(); } catch (e) { toast(e.message); } };
  $("dSnap").onclick = () => startCapture();
  $("dBody").querySelectorAll("[data-reveal]").forEach((b) => (b.onclick = () => f.reveal(b.dataset.reveal)));
  $("dBody").querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => f.openPath(b.dataset.open)));
  $("dBody").querySelectorAll("[data-role]").forEach((sel) => (sel.onchange = async () => {
    try { await rpc("ref_role", { shot: s.id, asset: sel.dataset.role, role: sel.value }); toast("用途已改"); await refreshAndDetail(); }
    catch (e) { toast(e.message); }
  }));
  $("dBody").querySelectorAll("[data-unref]").forEach((b) => (b.onclick = async () => {
    try { await rpc("ref_remove", { shot: s.id, asset: b.dataset.unref }); toast("已移除"); await refreshAndDetail(); }
    catch (e) { toast(e.message); }
  }));
  $("dBody").querySelectorAll("[data-pe]").forEach((ta) => (ta.onchange = async () => {
    try { await rpc("prompt_set", { shot: s.id, [ta.dataset.pe]: ta.value }); toast("提示词已保存"); }
    catch (e) { toast(e.message); }
  }));
  $("dBody").querySelectorAll("[data-dep]").forEach((tag) => (tag.onclick = () => openDetail(tag.dataset.dep)));
  $("dBody").querySelectorAll("[data-asset-jump]").forEach((b) => (b.onclick = async () => {
    try { await rpc("select", { shot: s.id, asset: b.dataset.assetJump }); toast("已选定"); await refreshAndDetail(); }
    catch (e) { toast(e.message); }
  }));
  const addRef = $("dAddRef");
  if (addRef) addRef.onclick = () => openAssetPicker(s.id);
}

async function refreshAndDetail() {
  await load();
  if (S.shotId) await openDetail(S.shotId, { keepScroll: true });
}

/* —— 动作 —— */
async function act(label, fn, silent = false) {
  try {
    const r = await fn();
    if (!silent) toast(`${label} 完成`);
    await load();
    return r;
  } catch (e) {
    toast(`${label} 失败：${e.message}`, 4000);
    throw e;
  }
}

$("bSubmit").onclick = () => act("提交待办", () => rpc("submit", {})).catch(() => {});
let busy = false;
async function runQueue() {
  if (busy) return;
  busy = true;
  const btn = $("bRun");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "执行中…";
  $("bSubmit").disabled = true;
  $("bBuild").disabled = true;
  $("bSnap").disabled = true;
  // 执行期间每 1.2s 拉一次状态：rail 里能看到 排队 → 执行中 → 完成
  const timer = setInterval(() => { load().catch(() => {}); }, 1200);
  try {
    const results = await rpc("run", {});
    const ok = results.filter((r) => r.ok).length;
    const failed = results.length - ok;
    toast(results.length ? `执行完成：成功 ${ok}${failed ? ` · 失败 ${failed}` : ""}` : "队列是空的", 3500);
  } catch (e) {
    toast(`执行失败：${e.message}`, 5000);
  } finally {
    clearInterval(timer);
    busy = false;
    btn.disabled = false;
    btn.textContent = label;
    $("bSubmit").disabled = false;
    $("bBuild").disabled = false;
    $("bSnap").disabled = false;
    await load();
    if (S.shotId) await openDetail(S.shotId, { keepScroll: true });
  }
}
$("bRun").onclick = runQueue;
$("bBuild").onclick = () => act("出片", () => rpc("build", {})).catch(() => {});
$("bStory").onclick = async () => {
  try {
    const r = await rpc("storyboard", {});
    toast(`故事板已生成：${r.out}`, 4000);
    await f.openPath(r.out);
  } catch (e) { toast(e.message, 4000); }
};
$("bSnap").onclick = () => startCapture();
$("dClose").onclick = closeDetail;
$("dPrev").onclick = () => stepShot(-1);
$("dNext").onclick = () => stepShot(1);

function stepShot(delta) {
  if (!S.shots.length) return;
  const i = S.shots.findIndex((s) => s.id === S.shotId);
  const next = S.shots[Math.min(S.shots.length - 1, Math.max(0, i + delta))];
  if (next) openDetail(next.id);
}

/* —— 素材选择 —— */
async function openAssetPicker(shotId) {
  const assets = await rpc("assets", {});
  const used = new Set((S.detail?.shot.references ?? []).map((r) => r.asset));
  $("assetList").innerHTML = assets.length
    ? assets.map((a) => `<div class="pick" data-asset="${esc(a.asset)}" style="opacity:${used.has(a.asset) ? 0.45 : 1}">
        <div class="grow"><div class="t">${esc(a.asset)}</div>
        <div class="d">${esc(a.mime)} · ${(a.bytes / 1024).toFixed(0)} KB · ${esc(a.provider ?? "?")}${used.has(a.asset) ? " · 已引用" : ""}</div></div>
        <button class="sm">添加</button></div>`).join("")
    : `<div style="padding:20px;font-family:var(--mono);font-size:12px;color:var(--ink-3)">项目里还没有已登记的素材</div>`;
  $("assetList").querySelectorAll(".pick").forEach((el) => {
    el.onclick = async () => {
      const asset = el.dataset.asset;
      if (used.has(asset)) { toast("已经在参考里了"); return; }
      try {
        await rpc("ref_add", { shot: shotId, asset, role: "other" });
        $("assetModal").classList.remove("open");
        toast("已添加参考，记得选用途");
        await refreshAndDetail();
      } catch (e) { toast(e.message); }
    };
  });
  $("assetModal").classList.add("open");
}
$("amClose").onclick = () => $("assetModal").classList.remove("open");

/* —— 项目切换 —— */
$("projBtn").onclick = async () => {
  const list = await f.projects();
  $("pickList").innerHTML = list.map((p) => `<div class="pick" data-dir="${esc(p.dir)}">
      <div class="grow"><div class="t">${esc(p.name || p.dir.split("/").pop())}${p.current ? ' <span class="now">当前</span>' : ""}</div>
      <div class="d">${esc(p.dir)}${p.exists ? "" : " · 已不存在"}</div></div></div>`).join("")
    || `<div style="padding:20px;font-family:var(--mono);font-size:12px;color:var(--ink-3)">还没有最近项目</div>`;
  $("pickList").querySelectorAll(".pick").forEach((el) => {
    el.onclick = async () => {
      try {
        await f.useProject(el.dataset.dir);
        $("modal").classList.remove("open");
        S.shotId = null;
        closeDetail();
        await load();
        toast("已切换项目");
      } catch (e) { toast(e.message); }
    };
  });
  $("modal").classList.add("open");
};
$("mClose").onclick = () => $("modal").classList.remove("open");
$("pickDir").onclick = async () => {
  const p = await f.pickProject();
  if (!p) return;
  $("modal").classList.remove("open");
  S.shotId = null;
  closeDetail();
  await load();
  toast(`已打开 ${p.name}`);
};

/* —— 截图标注 —— */
const snap = S.snap;
const canvas = $("snapCanvas");
let ctx = canvas.getContext("2d");

function startCapture() {
  f.capture().then(openSnap).catch((e) => toast(e.message));
}

function openSnap(dataUrl) {
  const img = new Image();
  img.onload = () => {
    snap.img = img;
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    snap.shapes = [];
    snap.sel = null;
    snap.drag = null;
    snap.path = null;
    $("snapPath").textContent = "";
    $("snapCopyPath").disabled = true;
    drawSnap();
    $("snap").classList.add("open");
    setTool("select");
    drawColors();
  };
  img.src = dataUrl;
}

function drawColors() {
  $("colors").innerHTML = COLORS.map((c) =>
    `<span class="swatch${snap.color === c ? " on" : ""}" data-c="${c}" style="background:${c}"></span>`
  ).join("");
  $("colors").querySelectorAll(".swatch").forEach((el) =>
    (el.onclick = () => { snap.color = el.dataset.c; drawColors(); })
  );
}

function drawSnap() {
  if (!snap.img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(snap.img, 0, 0);
  for (const s of snap.shapes) drawShape(s);
  if (snap.drag) drawShape({ ...snap.drag, preview: true });
  if (snap.sel) {
    ctx.save();
    ctx.fillStyle = "rgba(173,58,32,.08)";
    ctx.fillRect(snap.sel.x, snap.sel.y, snap.sel.w, snap.sel.h);
    ctx.setLineDash([10, 6]);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#ad3a20";
    ctx.strokeRect(snap.sel.x, snap.sel.y, snap.sel.w, snap.sel.h);
    ctx.restore();
  }
}

function drawShape(s) {
  ctx.save();
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  ctx.lineWidth = Math.max(3, canvas.width / 420);
  ctx.lineCap = "round";
  if (s.type === "rect") {
    ctx.fillStyle = "rgba(173,58,32,.07)";
    ctx.fillRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
    ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
  } else if (s.type === "arrow") {
    const a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    const head = Math.max(14, canvas.width / 90);
    ctx.beginPath();
    ctx.moveTo(s.x2, s.y2);
    ctx.lineTo(s.x2 - head * Math.cos(a - 0.4), s.y2 - head * Math.sin(a - 0.4));
    ctx.lineTo(s.x2 - head * Math.cos(a + 0.4), s.y2 - head * Math.sin(a + 0.4));
    ctx.closePath();
    ctx.fill();
  } else if (s.type === "text") {
    const size = Math.max(18, canvas.width / 70);
    ctx.font = `600 ${size}px "Iowan Old Style", "Songti SC", serif`;
    const w = ctx.measureText(s.text).width;
    ctx.fillStyle = "rgba(248,243,232,.92)";
    ctx.fillRect(s.x1 - 6, s.y1 - size, w + 12, size * 1.35);
    ctx.fillStyle = s.color;
    ctx.fillText(s.text, s.x1, s.y1);
  }
  ctx.restore();
}

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

canvas.addEventListener("pointerdown", (e) => {
  if (!snap.img) return;
  const p = canvasPoint(e);
  canvas.setPointerCapture(e.pointerId);
  if (snap.tool === "select") {
    snap.sel = { x: p.x, y: p.y, w: 0, h: 0 };
    snap.drag = null;
  } else if (snap.tool === "text") {
    openTextInput(p);
    return;
  } else {
    snap.drag = { type: snap.tool, color: snap.color, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  }
  drawSnap();
});

canvas.addEventListener("pointermove", (e) => {
  if (!snap.img) return;
  const p = canvasPoint(e);
  if (snap.tool === "select" && snap.sel) {
    snap.sel.w = p.x - snap.sel.x;
    snap.sel.h = p.y - snap.sel.y;
  } else if (snap.drag) {
    snap.drag.x2 = p.x;
    snap.drag.y2 = p.y;
  } else return;
  drawSnap();
});

canvas.addEventListener("pointerup", (e) => {
  if (!snap.img) return;
  const p = canvasPoint(e);
  if (snap.tool === "select" && snap.sel) {
    snap.sel = normRect(snap.sel);
    if (snap.sel.w < 8 || snap.sel.h < 8) snap.sel = null;
  } else if (snap.drag) {
    const s = { ...snap.drag, x2: p.x, y2: p.y };
    if (Math.hypot(s.x2 - s.x1, s.y2 - s.y1) > 8) pushShape(s);
    snap.drag = null;
  }
  drawSnap();
});

function normRect(r) {
  return {
    x: Math.min(r.x, r.x + r.w),
    y: Math.min(r.y, r.y + r.h),
    w: Math.abs(r.w),
    h: Math.abs(r.h),
  };
}

function pushShape(s) {
  snap.shapes.push(s);
  drawSnap();
}

function openTextInput(p) {
  const input = $("txtInput");
  const r = canvas.getBoundingClientRect();
  const scale = r.width / canvas.width;
  input.style.display = "block";
  input.style.left = `${p.x * scale}px`;
  input.style.top = `${p.y * scale - 8}px`;
  input.value = "";
  input.focus();
  input.onkeydown = (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      const size = Math.max(18, canvas.width / 70);
      pushShape({ type: "text", color: snap.color, x1: p.x, y1: p.y + size * 0.2, text: input.value.trim() });
      closeTextInput();
    }
    if (e.key === "Escape") closeTextInput();
  };
  input.onblur = closeTextInput;
}
function closeTextInput() {
  const input = $("txtInput");
  input.style.display = "none";
  input.onkeydown = null;
  input.onblur = null;
}

$("snapUndo").onclick = () => { if (snap.shapes.length) { snap.shapes.pop(); } else snap.sel = null; drawSnap(); };
$("snapCrop").onclick = () => {
  if (!snap.sel || snap.sel.w < 8) return toast("先框选一块区域");
  const { x, y, w, h } = snap.sel;
  const tmp = document.createElement("canvas");
  tmp.width = Math.round(w);
  tmp.height = Math.round(h);
  tmp.getContext("2d").drawImage(canvas, x, y, w, h, 0, 0, w, h);
  const img = new Image();
  img.onload = () => {
    snap.img = img;
    canvas.width = img.width;
    canvas.height = img.height;
    snap.shapes = [];
    snap.sel = null;
    drawSnap();
    toast("已裁剪");
  };
  img.src = tmp.toDataURL("image/png");
};
$("snapCopy").onclick = async () => {
  const data = canvas.toDataURL("image/png");
  await f.clipboardImage(data);
  toast("图片已复制到剪贴板");
};
$("snapSave").onclick = async () => {
  try {
    const data = canvas.toDataURL("image/png");
    const r = await rpc("save_markup", { png: data.replace(/^data:image\/png;base64,/, "") });
    snap.path = r.path;
    $("snapPath").textContent = r.path;
    $("snapCopyPath").disabled = false;
    await f.clipboardText(r.path);
    toast("已保存，路径已复制到剪贴板");
  } catch (e) { toast(e.message, 4000); }
};
$("snapCopyPath").onclick = async () => {
  if (!snap.path) return;
  await f.clipboardText(snap.path);
  toast("路径已复制");
};
$("snapClose").onclick = () => {
  $("snap").classList.remove("open");
  snap.img = null;
  snap.shapes = [];
  snap.sel = null;
  $("snapPath").textContent = "";
  $("snapCopyPath").disabled = true;
};

function setTool(tool) {
  snap.tool = tool;
  document.querySelectorAll(".snapbar [data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === tool));
  if (tool !== "select") snap.sel = null;
  drawSnap();
}
document.querySelectorAll(".snapbar [data-tool]").forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));

/* —— 全局快捷键 —— */
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "s") {
    e.preventDefault();
    if (!$("snap").classList.contains("open")) startCapture();
    return;
  }
  if (e.key === "Escape") {
    if ($("snap").classList.contains("open")) { $("snapClose").click(); return; }
    if ($("assetModal").classList.contains("open")) { $("assetModal").classList.remove("open"); return; }
    if ($("modal").classList.contains("open")) { $("modal").classList.remove("open"); return; }
    if ($("drawer").classList.contains("open")) { closeDetail(); return; }
  }
  if ($("drawer").classList.contains("open") && !e.metaKey && !e.ctrlKey) {
    if (e.key === "ArrowDown") { e.preventDefault(); stepShot(1); }
    if (e.key === "ArrowUp") { e.preventDefault(); stepShot(-1); }
  }
});

$("scroll").addEventListener("scroll", () => {
  $("main").classList.toggle("scrolled", $("scroll").scrollTop > 4);
});

/* —— 从 agent / CLI 唤起 —— */
f.onFocusShot((id) => { openDetail(id); });
f.onOpenProject(async ({ project, shot }) => {
  try {
    await f.useProject(project);
    S.shotId = null;
    closeDetail();
    await load();
    if (shot) await openDetail(shot);
    toast("已切换项目");
  } catch (e) { toast(e.message); }
});

load().catch((e) => toast(`加载失败：${e.message}`, 5000));
setInterval(() => {
  if ($("drawer").classList.contains("open") || $("snap").classList.contains("open") || $("modal").classList.contains("open") || $("assetModal").classList.contains("open")) return;
  load().catch(() => {});
}, 6000);

/* 缩略图：作业完成后抽首帧，按需生成并缓存 */
const posterCache = new Map();
async function posters() {
  for (const shot of S.shots) {
    if (!shot.asset) continue;
    const card = document.querySelector(`.card[data-shot="${shot.id}"] .frame`);
    if (!card || card.querySelector("img")) continue;
    let path = posterCache.get(shot.id + shot.asset);
    if (!path) {
      try { path = (await rpc("poster", { shot: shot.id })).path; posterCache.set(shot.id + shot.asset, path); }
      catch { continue; }
    }
    const img = document.createElement("img");
    img.src = fileUrl(path) + `?v=${encodeURIComponent(shot.asset)}`;
    img.onload = () => { card.prepend(img); };
  }
}
</script>
